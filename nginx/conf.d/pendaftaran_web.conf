server {
    listen 80;
    listen [::]:80; # Listen on IPv6 as well
    server_name localhost; # Or your custom local domain, e.g., pendaftaran.test

    # IMPORTANT: Set this to the absolute path of your Laravel project's public directory
    root /home/dit/Git/possi_pendaftaran/laravel_project/pendaftaran_web/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html index.htm; # Define default index files

    charset utf-8;

    location / {
        # This is Laravel's "front controller" pattern:
        # Try to serve the requested file/directory directly, otherwise
        # pass the request to index.php with the original query string.
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hide sensitive files (like .env, .git, Composer files, etc.)
    location ~ /\. {
        deny all;
    }

    # Pass PHP requests to PHP-FPM
    location ~ \.php$ {
        # Check if the PHP file actually exists before processing
        try_files $fastcgi_script_name =404;

        # This must match the 'listen' directive in your www.conf (Step 3)
        fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
        fastcgi_index index.php;
        # Crucial for Laravel: sets the script filename for PHP-FPM
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params; # Includes common FastCGI parameters
    }
}
